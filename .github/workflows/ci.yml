name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

  # `windows.rs` is `#[cfg(windows)]`, so the job above never even parses it -
  # it went unlinted long enough to accumulate a clippy error nobody could
  # see. The release build compiles it, but only after a tag, which is far too
  # late to hear about it.
  windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the Windows target
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Clippy
        run: cargo clippy --target x86_64-pc-windows-gnu -- -D warnings

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
